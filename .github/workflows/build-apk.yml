
name: Build Raseef Al Estlam APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        id: locate
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'Raseef_Al_Estlam_v1.5_SOURCE.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: v1.5 source ZIP not found"
            exit 1
          fi

          mkdir -p build_source
          unzip -q "$ZIP" -d build_source

          PROJECT_DIR="$(dirname "$(find build_source -type f -name settings.gradle -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android project files not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raseef-Al-Estlam-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
