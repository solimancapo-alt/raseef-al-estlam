name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP في الصفحة الرئيسية للمستودع."
            exit 1
          fi
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          SETTINGS_FILE="$(find extracted_project -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ملف settings.gradle غير موجود داخل ملف ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "مجلد app أو ملف app/build.gradle غير موجود داخل المشروع."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Raseef-Al-Estlam-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
