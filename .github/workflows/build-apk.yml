
name: Build Raseef Al Estlam APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Locate project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract project
        run: |
          mkdir -p extracted_project
          unzip -o "$ZIP_FILE" -d extracted_project

      - name: Locate Android project
        shell: bash
        run: |
          APP_FILE=$(find extracted_project -type f -path "*/app/build.gradle" | head -n 1)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          PROJECT_DIR="${APP_FILE%/app/build.gradle}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Fix Kotlin JVM target
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          path = os.path.join(os.environ["PROJECT_DIR"], "app", "build.gradle")

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          if re.search(r'kotlinOptions\s*\{', content):
              content = re.sub(
                  r'kotlinOptions\s*\{[^}]*\}',
                  "kotlinOptions { jvmTarget = '1.8' }",
                  content,
                  count=1
              )
          else:
              match = re.search(r'android\s*\{', content)
              if not match:
                  raise SystemExit("ERROR: android block not found")

              content = (
                  content[:match.end()]
                  + "\n    kotlinOptions { jvmTarget = '1.8' }\n"
                  + content[match.end():]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Kotlin JVM target set to 1.8")
          PY

      - name: Display Kotlin error context
        shell: bash
        run: |
          SOURCE=$(find "$PROJECT_DIR/app/src/main/java" -name "MainActivity.kt" | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "======================================"
          echo "BUILDING SOURCE: $SOURCE"
          echo "MAINACTIVITY LINES 135-155"
          echo "======================================"

          nl -ba "$SOURCE" | sed -n '135,155p'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raseef-Al-Estlam-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
