
name: Build Raseef Al Estlam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          SETTINGS_FILE=$(find extracted_project \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create JVM compatibility fix
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/force-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              plugins.withId("org.jetbrains.kotlin.android") {
                  tasks.configureEach { task ->
                      if (task.name.toLowerCase().contains("kotlin")) {
                          task.kotlinOptions.jvmTarget = "17"
                      }
                  }
              }
          }
          EOF

      - name: Show project files
        run: |
          echo "Project: $PROJECT_DIR"
          find "$PROJECT_DIR/app" -maxdepth 2 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: |
          gradle -I "$RUNNER_TEMP/force-jvm.gradle" -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raseef-Al-Estlam-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
