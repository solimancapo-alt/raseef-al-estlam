
name: Build Raseef Al Estlam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found in repository root."
            exit 1
          fi

          mkdir extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          SETTINGS_FILE=$(find extracted_project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]
          gradle_file = os.path.join(project, "app", "build.gradle")

          if not os.path.isfile(gradle_file):
              raise SystemExit("ERROR: app/build.gradle not found")

          with open(gradle_file, "r", encoding="utf-8") as f:
              content = f.read()

          java_block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """

          if "compileOptions" in content:
              content = re.sub(
                  r"compileOptions\s*\{.*?\}",
                  java_block.strip(),
                  content,
                  count=1,
                  flags=re.S
              )
          else:
              content = re.sub(
                  r"(android\s*\{)",
                  r"\1\n" + java_block,
                  content,
                  count=1
              )

          if re.search(r"kotlinOptions\s*\{", content):
              if re.search(r"jvmTarget\s*=", content):
                  content = re.sub(
                      r"jvmTarget\s*=\s*['\"][^'\"]+['\"]",
                      'jvmTarget = "17"',
                      content
                  )
              else:
                  content = re.sub(
                      r"(kotlinOptions\s*\{)",
                      r'\1\n        jvmTarget = "17"',
                      content,
                      count=1
                  )
          else:
              content = re.sub(
                  r"(android\s*\{)",
                  r'\1\n    kotlinOptions { jvmTarget = "17" }\n',
                  content,
                  count=1
              )

          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(content)

          print("Java and Kotlin targets set to 17.")

          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raseef-Al-Estlam-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
