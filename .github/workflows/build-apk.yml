
name: Build Raseef Al Estlam APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Locate project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      - name: Extract project
        run: |
          mkdir -p extracted_project
          unzip -o "$ZIP_FILE" -d extracted_project

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          for file in $(find extracted_project -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \)); do

            if [[ "$file" == */app/build.gradle || \
                  "$file" == */app/build.gradle.kts ]]; then
              PROJECT_DIR="${file%/app/*}"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android app module not found."
            find extracted_project -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Show MainActivity source
        run: |
          SOURCE=$(find "$PROJECT_DIR/app/src/main/java" \
            -name "MainActivity.kt" | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          echo "Building source: $SOURCE"
          nl -ba "$SOURCE" | sed -n '135,155p'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raseef-Al-Estlam-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
